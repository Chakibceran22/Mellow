# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# NOTE for whoever edits an Android module's build file: do NOT apply
# `org.jetbrains.kotlin.android`. AGP 9 has built-in Kotlin support enabled by default and
# registers the `kotlin` extension itself; applying KGP on top fails with
# "Cannot add extension with name 'kotlin'". The Compose compiler plugin works on top.
