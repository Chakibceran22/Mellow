# Builds, signs and publishes a release whenever a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the only place the version is written. v0.2.0 becomes versionName "0.2.0"
# and versionCode 200 (major * 10000 + minor * 100 + patch), so each new tag is a higher
# versionCode than the last and phones accept it as an update.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions). From the
# project folder, each of these sets one without showing it:
#
#   base64 -i keys/mellow-release-new.jks | gh secret set KEYSTORE_BASE64
#   gh secret set KEYSTORE_PASSWORD < keys/key-password
#   gh secret set KEY_PASSWORD < keys/key-password
#   gh secret set KEY_ALIAS --body mellow
#
# The repository's older ANDROID_* secrets belong to a different key and are not used.
#
# The key is checked after the build: the APK must carry the certificate named in
# RELEASE_CERT_SHA256 below, or nothing is published. A phone only accepts an update signed
# with the same key as the app it already has, so a release signed with any other key,
# the debug key included, would be a release nobody can install over what they have.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # to create the release and upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH (e.g. v0.2.0)"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if (( minor > 99 || patch > 99 )); then
            echo "::error::Minor and patch must stay below 100 for the versionCode scheme"
            exit 1
          fi
          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Without keystore.properties the build quietly signs with the debug key, so a
      # missing secret has to stop the run here rather than produce a wrongly signed APK.
      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/mellow-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release APK
        run: >
          ./gradlew :app:assembleRelease
          -Pmellow.versionName=${{ steps.version.outputs.name }}
          -Pmellow.versionCode=${{ steps.version.outputs.code }}

      - name: Check it is signed with the release key
        env:
          # SHA-256 of the release certificate (keys/mellow-release-new.jks, alias mellow).
          # Not a secret: it is printed by `keytool -list` and carried by every APK.
          RELEASE_CERT_SHA256: 2727d77e64daf8334cadfc706bc3248f0b0112ec4133d6224e836bcf148103c8
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs"
          # The line reads "Signer #1 certificate SHA-256 digest: ..." or "V2 Signer:
          # certificate SHA-256 digest: ...", depending on the build tools.
          actual="$(grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' <<< "$certs" | head -1 | awk '{print $NF}')"
          if [[ "$actual" != "$RELEASE_CERT_SHA256" ]]; then
            echo "::error::The APK is signed with certificate '${actual:-none}', not the release key ($RELEASE_CERT_SHA256)"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="mellow-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "Mellow ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/mellow-release.jks"
